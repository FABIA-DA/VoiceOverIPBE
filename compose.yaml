services:
  asterisk:
    build:
      context: ./Asterisk
      dockerfile: Dockerfile
    ports:
      - "5060:5060/udp"
      - "8088:8088"
      - "10000-10100:10000-10100/udp"
    depends_on:
      coqui-app:
        condition: service_completed_successfully
    volumes:
      - shared-sounds:/var/lib/asterisk/sounds
      - recordings:/var/spool/asterisk/recording

  coqui-app:
    build:
      context: ./CoquiApp
      dockerfile: Dockerfile
    volumes:
      - shared-sounds:/app/out
      - tts-models:/root/.local/share/tts

  ari-app:
    build:
      context: ./ARIApp
      dockerfile: Dockerfile
    depends_on:
      asterisk:
        condition: service_started
      whisper-be:
        condition: service_healthy
      coqui-be:
        condition: service_healthy
    volumes:
      - recordings:/app/recordings

  # whisper-be:
  #  build:
  #    context: ./WhisperBE
  #    dockerfile: Dockerfile
  #  ports:
  #    - "8000:8000"
  #  volumes:
  #    - whisper-models:/root/.cache/whisper
  #  healthcheck:
  #    test: [ "CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/healthcheck\")' || exit 1" ]
  #    interval: 5s
  #    timeout: 3s
  #    retries: 5

  coqui-be:
    build:
      context: ./CoquiBE
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - shared-sounds:/app/out
      - tts-models:/root/.local/share/tts
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/healthcheck\")' || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  shared-sounds:
  recordings:
  tts-models:
  whisper-models: