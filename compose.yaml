services:
  asterisk:
    build:
      context: ./Asterisk
      dockerfile: Dockerfile
    ports:
      - "5060:5060/udp"
      - "8088:8088"
      - "10000-10100:10000-10100/udp"
    depends_on:
      coqui-app:
        condition: service_completed_successfully
    volumes:
      - shared-sounds:/var/lib/asterisk/sounds
      - recordings:/var/spool/asterisk/recording

  coqui-app:
    build:
      context: ./CoquiApp
      dockerfile: Dockerfile
    volumes:
      - shared-sounds:/app/out

  ari-app:
    build:
      context: ./ARIApp
      dockerfile: Dockerfile
    depends_on:
      asterisk:
        condition: service_started
      whisper-be:
        condition: service_healthy
      coqui-be:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - recordings:/app/recordings

  whisper-be:
    build:
      context: ./WhisperBE
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - whisper-models:/root/.cache/whisper
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/healthcheck\")' || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5

  coqui-be:
    build:
      context: ./CoquiBE
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - shared-sounds:/app/out
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/healthcheck\")' || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5

  migrations:
    container_name: formbe-migrations
    build:
      context: ./FormBE
      dockerfile: Dockerfile.Migrations
    restart: "no"
    volumes:
      # migrations also need the correct connection string
      - ./backend-config.json:/app/appsettings.json:ro
    depends_on:
      database:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

  database:
    container_name: form-database
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - form-db_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "4"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 2s
      timeout: 4s
      retries: 10

  backend:
    container_name: form-backend
    build:
      context: ./FormBE
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
    volumes:
      - ./backend-config.json:/app/appsettings.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

volumes:
  form-db_data:
    external: true
  shared-sounds:
  recordings:
  whisper-models: