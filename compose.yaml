services:
  asterisk:
    build:
      context: ./Asterisk
      dockerfile: Dockerfile
    ports:
      - "5060:5060/udp"
      - "8088:8088"
      - "10000-10100:10000-10100/udp"
    restart: unless-stopped
    volumes:
      - shared-audio:/var/lib/asterisk/sounds/custom
      - recordings:/var/spool/asterisk/recording
      - ./Asterisk/asterisk-config:/etc/asterisk
    healthcheck:
      test: [ "CMD-SHELL", "asterisk -rx 'core show uptime' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  coqui-app:
    build:
      context: ./CoquiApp
      dockerfile: Dockerfile
    restart: no
    volumes:
      - shared-audio:/app/out

  ari-app:
    build:
      context: ./ARIApp
      dockerfile: Dockerfile
    depends_on:
      asterisk:
        condition: service_healthy
      whisper-be:
        condition: service_healthy
      coqui-be:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    volumes:
      - recordings:/app/recordings

  whisper-be:
    build:
      context: ./WhisperBE
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - whisper-cache:/home/mambauser/.cache
    environment:
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=1
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/healthcheck\")' || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5

  coqui-be:
    build:
      context: ./CoquiBE
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - shared-audio:/app/out
      - coqui-be-cache:/root/.cache
      - coqui-models:/root/.local/share/tts
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/healthcheck\")' || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5

  migrations:
    container_name: formbe-migrations
    build:
      context: ./FormBE
      dockerfile: Dockerfile.Migrations
    restart: "no"
    volumes:
      # migrations also need the correct connection string
      - ./backend-config.json:/app/appsettings.json:ro
    depends_on:
      database:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

  database:
    container_name: form-database
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - form-db_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "4"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 2s
      timeout: 4s
      retries: 10

  backend:
    container_name: form-backend
    build:
      context: ./FormBE
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5200:5200"
    environment:
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
    volumes:
      - ./backend-config.json:/app/appsettings.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  frontend:
    container_name: form-frontend
    build:
      context: ./FormFE
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  form-db_data:
    external: true
  shared-audio:
    external: true
  recordings:
    external: true
  coqui-be-cache:
    external: true
  coqui-models:
    external: true
  whisper-cache:
    external: true