services:
  asterisk:
    build:
      context: ./Asterisk
      dockerfile: Dockerfile
    ports:
      - "5060:5060/udp"
      - "8088:8088"
      - "10000-10100:10000-10100/udp"
    depends_on:
      coqui-app:
        condition: service_completed_successfully
    volumes:
      - shared-sounds:/var/lib/asterisk/sounds:rw
      - recordings:/var/spool/asterisk/recording:rw
  coqui-app:
    build:
      context: ./CoquiApp
      dockerfile: Dockerfile
    volumes:
      - shared-sounds:/app/out:w
  ari-app:
    build:
      context: ./ARIApp
      dockerfile: Dockerfile
    depends_on:
      asterisk:
        condition: service_started
    volumes:
      - recordings:/app/recordings:rw

volumes:
  shared-sounds:
  recordings: