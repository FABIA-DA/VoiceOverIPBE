[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=10.0.0.0/8

[1000]
type=endpoint
transport=transport-udp
context=default
disallow=all
allow=ulaw
auth=auth1000
aors=1000
force_rport=yes
rtp_symmetric=yes
direct_media=no

[auth1000]
type=auth
auth_type=userpass
username=1000
password=1234

[1000]
type=aor
max_contacts=1

[1001]
type=endpoint
transport=transport-udp
context=default
disallow=all
allow=ulaw
auth=auth1001
aors=1001
force_rport=yes
rtp_symmetric=yes

[auth1001]
type=auth
auth_type=userpass
username=1001
password=1234

[1001]
type=aor
max_contacts=1
