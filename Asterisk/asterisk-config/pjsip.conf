[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[1000]
type=endpoint
context=default
disallow=all
allow=ulaw
auth=1000-auth
aors=1000-aor
identify=1000-identify

[1000-auth]
type=auth
auth_type=userpass
username=1000
password=1234

[1000-aor]
type=aor
max_contacts=1
remove_existing=yes

[1000-identify]
type=identify
endpoint=1000
match=10.0.0.235